[package]
name = "levee"
version = "0.1.0"
description = "Levee — autonomous landslide-relief disbursement program for Solana."
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "levee"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# `mock-oracle` swaps the real Switchboard On-Demand reader for a tiny on-chain
# mock account so the full payout logic can be exercised by `anchor test` on a
# local validator (no live oracle required). NEVER enable in production builds.
mock-oracle = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
# Switchboard On-Demand on-chain reader (pull feeds). Pinned to a 0.x line;
# verify the exact method names against the version you build with.
switchboard-on-demand = "0.3.4"
# Decimal type used to convert the feed value. Keep the major/minor in line with
# whatever switchboard-on-demand re-exports to avoid a type mismatch.
rust_decimal = "1.35"
