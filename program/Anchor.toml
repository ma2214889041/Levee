[toolchain]
anchor_version = "0.30.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
levee = "GYMBo4SUqjSCvvN1Bzjmu5MPjFzt47GM3vVDZFM7sUMq"

[programs.devnet]
levee = "GYMBo4SUqjSCvvN1Bzjmu5MPjFzt47GM3vVDZFM7sUMq"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# Default localnet test run. The tests use the `mock-oracle` feature so payout
# logic can be exercised without a live Switchboard feed.
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
startup_wait = 10000

[test.validator]
url = "https://api.devnet.solana.com"
